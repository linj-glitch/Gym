# DeepSWE v1.1 with the Claude Code CLI harness. Model traffic goes straight
# from the sandbox to the Anthropic-compatible endpoint named by
# CLAUDE_CODE_ANTHROPIC_BASE_URL (e.g. a Switchyard route), so the resources
# server's model egress target comes from NEMO_GYM_SANDBOX_MODEL_BASE_URL
# rather than a Gym model server.

config_paths:
  - responses_api_agents/claude_code_sandboxed_agent/configs/claude_code_agent.yaml
  - resources_servers/deepswe/configs/deepswe.yaml

claude_code_deepswe_resources_server:
  _inherit_from: deepswe_resources_server

claude_code_sandboxed_agent_deepswe:
  _inherit_from: claude_code_sandboxed_agent
  responses_api_agents:
    claude_code_sandboxed_agent:
      sandbox_timeout: 10800  # DeepSWE agent timeout override: 3 hours.
      resources_server:
        type: resources_servers
        name: claude_code_deepswe_resources_server
      datasets:
        - name: deepswe_v1_1
          type: benchmark
          jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
          prepare_script: benchmarks/deepswe/prepare.py
          num_repeats: 3
