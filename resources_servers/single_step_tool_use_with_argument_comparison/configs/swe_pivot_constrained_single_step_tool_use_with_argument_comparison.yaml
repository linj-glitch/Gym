# Constraint-verified BINARY swe_pivot reward (pivot-RL milestone 2).
# SAME instance names as swe_pivot_single_step_tool_use_with_argument_comparison.yaml
# so existing pivot rows (agent_ref = ..._agent) route here unchanged; only the
# resources-server entrypoint differs. reward = 1 iff binary_match(sampled,
# expected) AND constraint verifier PASS, else 0 — the mining belt's exact
# gated-success predicate (constrained_app.py).
swe_pivot_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      entrypoint: constrained_app.py
      domain: agent
      similarity_full_credit: 0.8
      verified: false
      description: Pivot-RL binary reward - swe_pivot match AND deterministic constraint compliance.
swe_pivot_single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    tool_simulation_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_pivot_single_step_tool_use_with_argument_comparison_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/example.jsonl
        num_repeats: 1
